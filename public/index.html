<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1><span class="logo" data-icon="download"></span> Loft</h1>
    <nav>
        <button data-tab="media" data-icon="image">媒體</button>
        <button data-tab="settings" data-icon="settings">設定</button>
    </nav>
    <div class="header-tools">
        <button id="font-down" class="icon text-icon" title="字小一點（Ctrl+-）">A−</button>
        <button id="font-up" class="icon text-icon" title="字大一點（Ctrl+=）">A＋</button>
        <button id="theme-toggle" class="icon" title="切換深淺色"></button>
        <div id="auth-badge" class="badge">…</div>
    </div>
</header>

<main>
    <!-- Media -->
    <section id="tab-media" class="tab hidden">
        <div class="browse">
            <aside class="chats">
                <div class="chats-tools">
                    <input id="c-q" type="search" placeholder="搜尋群組、頻道">
                    <div id="c-folders" class="folders"></div>
                    <div class="row">
                        <select id="c-type">
                            <option value="">全部</option>
                            <option value="channel">頻道</option>
                            <option value="group">群組</option>
                            <option value="user">私訊</option>
                        </select>
                        <label class="check"><input type="checkbox" id="c-archived"> 封存</label>
                        <button id="c-refresh" class="icon" data-icon="refresh" title="重新整理列表"></button>
                    </div>
                </div>
                <ul id="c-list"></ul>
            </aside>
            <section class="chat">
                <div id="m-empty" class="chat-empty">
                    <div class="big-ico" data-icon="image"></div>
                    <h2>選一個群組或頻道</h2>
                    <ul>
                        <li>點開就是媒體牆，論壇群組會把所有話題合在一起</li>
                    </ul>
                </div>
                <div id="m-chat" class="hidden">
                    <div class="chat-head">
                        <button id="m-back" class="icon back" data-icon="back" title="返回列表"></button>
                        <span id="m-avatar" class="avatar"></span>
                        <div class="chat-meta">
                            <b id="m-title"></b>
                            <div id="m-sub" class="muted"></div>
                        </div>
                        <button id="m-reload" class="icon" data-icon="refresh" title="重新整理媒體牆"></button>
                    </div>
                    <div class="filterbar">
                        <select id="m-topic" class="hidden" title="話題"></select>
                        <select id="m-type" title="類型">
                            <option value="visual">圖片、影片、GIF</option>
                            <option value="photo">只有圖片</option>
                            <option value="video">只有影片</option>
                            <option value="gif">GIF</option>
                            <option value="document">檔案</option>
                            <option value="music">音樂</option>
                            <option value="voice">語音與圓形影片</option>
                            <option value="all">全部媒體</option>
                        </select>
                        <span class="lbl">日期</span><input type="date" id="m-from" title="從"><span class="lbl">～</span><input type="date" id="m-to" title="到">
                        <span class="lbl">至少</span><input type="number" id="m-min" min="0" step="any" placeholder="0" title="最小大小"><span class="lbl">MB</span>
                        <select id="m-order" title="排序">
                            <option value="new">新到舊</option>
                            <option value="old">舊到新</option>
                        </select>
                        <label class="check"><input type="checkbox" id="m-notdl"> 只看未下載</label>
                        <input type="search" id="m-q" placeholder="搜尋說明文字、檔名">
                    </div>
                    <div id="m-wall">
                        <div id="m-grid" class="wall"></div>
                        <div id="m-end" class="wall-end"></div>
                    </div>
                </div>
            </section>
        </div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" class="tab hidden">
        <div class="settings-cols">
        <div class="s-col">
        <div class="card">
            <h2>Telegram 登入</h2>
            <div id="login-done" class="hidden">
                <p>已登入：<b id="login-user"></b></p>
                <button id="btn-logout" class="danger">登出並清除 session</button>
            </div>
            <div id="login-form">
                <p class="muted">先到 <a href="https://my.telegram.org/apps" target="_blank" rel="noopener">my.telegram.org/apps</a> 建立應用程式，取得 api_id 與 api_hash。</p>
                <div class="grid">
                    <label>api_id <input id="set-api-id" inputmode="numeric"></label>
                    <label>api_hash <input id="set-api-hash" type="password" placeholder="已儲存時留空即可"></label>
                </div>
                <button id="btn-save-api">儲存 API 憑證</button>
                <div class="step" id="step-phone" style="margin-top:1rem">
                    <label>手機號碼（含國碼，例如 +886912345678） <input id="login-phone"></label>
                    <button id="btn-send-code" class="primary">傳送驗證碼</button>
                </div>
                <div class="step hidden" id="step-code">
                    <label>驗證碼 <span id="code-hint" class="muted"></span> <input id="login-code" inputmode="numeric"></label>
                    <button id="btn-sign-in" class="primary">登入</button>
                </div>
                <div class="step hidden" id="step-password">
                    <label>兩步驟驗證密碼 <input id="login-password" type="password"></label>
                    <button id="btn-password" class="primary">送出</button>
                </div>
            </div>
            <p class="muted">登入資料只存在本機資料夾的 <code>session.txt</code>。網頁只聽 127.0.0.1，不對外開放。</p>
        </div>

        <div class="card">
            <h2>快取</h2>
            <p class="muted">媒體牆看過的縮圖、預覽過的原檔會暫存在 <code>data\cache</code>。目前：<span id="cache-size">-</span></p>
            <button id="btn-clear-cache" class="danger">清除快取</button>
        </div>
        </div>
        </div>
    </section>
</main>

<!-- Generic prompt dialog -->
<dialog id="ask-dialog">
    <h2 id="ask-title"></h2>
    <div id="ask-body"></div>
    <div class="actions" id="ask-buttons"></div>
</dialog>

<!-- Viewer -->
<dialog id="viewer">
    <div class="viewer-tools">
        <span id="viewer-count" class="v-count"></span>
        <span id="viewer-name" class="v-name"></span>
        <span class="spacer"></span>
        <button id="viewer-zoom" class="v-btn" data-icon="zoom" title="縮放（Z）"></button>
        <button id="viewer-play" class="v-btn" data-icon="play" title="幻燈片（空白鍵）"></button>
        <button id="viewer-close" class="v-btn" data-icon="close" title="關閉（Esc）"></button>
    </div>
    <button id="viewer-prev" class="v-nav prev" data-icon="left" title="上一個（←）"></button>
    <div id="viewer-body"></div>
    <button id="viewer-next" class="v-nav next" data-icon="right" title="下一個（→）"></button>
    <div id="viewer-status" class="v-status"></div>
    <div id="viewer-caption" class="v-caption hidden"></div>
</dialog>

<div id="toast"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="media.js"></script>
</body>
</html>
